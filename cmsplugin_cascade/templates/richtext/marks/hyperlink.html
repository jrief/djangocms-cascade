{% load page_url from cms_tags %}{% spaceless %}
{% if attrs.cms_page %}
<a href="{% page_url attrs.cms_page %}">{{ text }}</a>
{% elif attrs.href %}
<a href="{{ attrs.href }}">{{ text }}</a>
{% elif attrs.mail_to %}
<a href="mailto:{{ attrs.mail_to }}">{{ text }}</a>
{% elif attrs.phone_number %}
<a href="tel:{{ attrs.phone_number }}">{{ text }}</a>
{% elif attrs.download_file %}
<a href="{{ attrs.download_file }}" download>{{ text }}</a>
{% endif %}
{% endspaceless %}
